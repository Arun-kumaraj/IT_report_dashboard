# Server Port
server.port=8080

# Application Name
spring.application.name=it-incident-job-monitoring

# ==============================================================
# MySQL Database Configuration (Default / Production Profile)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/monitoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: Run schema.sql and data.sql if database is fresh
spring.sql.init.mode=always

# Enable CORS or scheduler settings if needed
logging.level.com.example.monitoring=INFO
